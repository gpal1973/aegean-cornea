name: Optimize hero image

on:
  push:
    branches:
      - design/corfu-background-hero
    paths:
      - .github/workflows/optimize-hero.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/corfu-background-hero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optimize hero to WebP
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('assets/aecc-poster-xviii-bluehour-background.jpg')
          out = Path('assets/aegc-corfu-hero.webp')
          img = Image.open(src).convert('RGB')
          if img.width > 1448:
              height = round(img.height * 1448 / img.width)
              img = img.resize((1448, height), Image.Resampling.LANCZOS)
          img.save(out, 'WEBP', quality=82, method=6)
          print(f'{out}: {out.stat().st_size} bytes, {img.width}x{img.height}')
          PY
      - name: Commit optimized asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/aegc-corfu-hero.webp
          git diff --cached --quiet && exit 0
          git commit -m 'Add optimized Corfu hero asset'
          git push
